<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820"><rect width="720" height="820" rx="24" fill="#f3f2ed"/><g font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif"><rect x="30" y="30" width="660" height="64" rx="12" fill="#153f35"/><text x="55" y="71" fill="#fff" font-size="23" font-weight="bold">截图示例 · 所有价格仅为测试值</text><text x="40" y="143" font-size="30" fill="#263c2d" font-weight="bold">杭州城中香格里拉大酒店</text><text x="40" y="181" font-size="19" fill="#7c8b73">示例行程：2026-10-17 至 2026-10-19 · 2 晚</text><rect x="30" y="215" width="660" height="220" rx="15" fill="white"/><text x="55" y="260" font-size="26" font-weight="bold" fill="#263c2d">示例大床房 · 不含早餐</text><text x="55" y="309" font-size="21" fill="#88967e">1 间 · 2 成人 · 免费取消（示例）</text><text x="55" y="398" font-size="20" fill="#88967e">全程总价</text><text x="465" y="398" font-size="44" font-weight="bold" fill="#b87542">¥1200</text><rect x="30" y="455" width="660" height="250" rx="15" fill="white"/><text x="55" y="505" font-size="26" font-weight="bold" fill="#263c2d">示例大床房 · 每晚含 2 份早餐</text><text x="55" y="550" font-size="21" fill="#88967e">1 间 · 2 成人 · 免费取消（示例）</text><text x="55" y="590" font-size="21" fill="#88967e">房型、日期、取消规则与上一档相同</text><text x="55" y="665" font-size="20" fill="#88967e">全程总价</text><text x="465" y="665" font-size="44" font-weight="bold" fill="#b87542">¥1440</text><text x="40" y="757" font-size="19" fill="#89937f">保留：酒店、日期、房型、两档总价、早餐份数、条款</text><text x="40" y="793" font-size="19" fill="#b0865b">遮住：姓名、电话、订单号。未下单的房型页即可。</text></g></svg>
